server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /_next/static/$uri /_next/static/$uri/ =404;
    }

    location /_next/ {
        alias /usr/share/nginx/html/.next/;
        expires max;
        access_log off;
    }

    location /public/ {
        alias /usr/share/nginx/html/public/;
        expires max;
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
} 